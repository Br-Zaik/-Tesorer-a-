name: Compilar ZIP Tesoreria

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Buscar ZIP subido
        id: zip
        shell: bash
        run: |
          ZIP=""

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            ZIP=$(git diff --name-only HEAD^ HEAD | grep -Ei '\.zip$' | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname "*.zip" -not -path "./extracted/*" | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontro ningun ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraer ZIP
        shell: bash
        run: |
          rm -rf extracted salida
          mkdir -p extracted salida
          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

      - name: Buscar proyecto Android
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene un proyecto Android."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar secretos de firma
        shell: bash
        run: |
          for V in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!V}" ]; then
              echo "ERROR: Falta el secreto $V"
              exit 1
            fi
          done

          echo "Los 4 secretos estan configurados."

      - name: Restaurar firma permanente
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/tesoreria-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: No se pudo reconstruir la firma."
            exit 1
          fi

          echo "TESORERIA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Dar permiso a Gradle
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
          fi

      - name: Leer version
        id: version
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"
          GRADLE_FILE="$PROJECT/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: No existe app/build.gradle.kts"
            exit 1
          fi

          VERSION_CODE=$(grep -m1 -E 'versionCode[[:space:]]*=' "$GRADLE_FILE" | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -m1 -E 'versionName[[:space:]]*=' "$GRADLE_FILE" | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "ERROR: No se pudo leer la version."
            exit 1
          fi

          echo "Version: $VERSION_NAME"
          echo "versionCode: $VERSION_CODE"

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=tesoreria-v${VERSION_NAME}-vc${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK release firmado
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"
          cd "$PROJECT"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleRelease --no-daemon --stacktrace
          else
            gradle clean assembleRelease --no-daemon --stacktrace
          fi

      - name: Buscar APK generado
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"

          APK=$(find "$PROJECT" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontro el APK release."
            exit 1
          fi

          mkdir -p salida

          cp "$APK" salida/tesoreria.apk

          sha256sum salida/tesoreria.apk > salida/tesoreria.apk.sha256

          echo "APK preparado correctamente."

      - name: Subir APK a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Tesoreria-${{ steps.version.outputs.name }}
          path: |
            salida/tesoreria.apk
            salida/tesoreria.apk.sha256
          if-no-files-found: error

      - name: Publicar actualizacion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="Tesoreria ${{ steps.version.outputs.name }}"

          cat > /tmp/notas.txt <<EOF
          Actualizacion de Tesoreria ${{ steps.version.outputs.name }}.

          versionCode: ${{ steps.version.outputs.code }}

          APK compilado automaticamente por GitHub Actions
          usando la firma permanente de Tesoreria.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release upload "$TAG" \
              salida/tesoreria.apk \
              salida/tesoreria.apk.sha256 \
              --clobber

            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file /tmp/notas.txt \
              --latest

          else

            gh release create "$TAG" \
              salida/tesoreria.apk \
              salida/tesoreria.apk.sha256 \
              --title "$TITLE" \
              --notes-file /tmp/notas.txt \
              --latest

          fi
