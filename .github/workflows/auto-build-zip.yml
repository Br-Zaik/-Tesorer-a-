name: Compilar ZIP subido

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Detectar ZIP
        id: zip
        shell: bash
        run: |
          ZIP=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            ZIP=$(git diff --name-only HEAD^ HEAD | grep -Ei '\.zip$' | head -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname "*.zip" -not -path "./extracted/*" | head -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún ZIP"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraer ZIP
        shell: bash
        run: |
          rm -rf extracted salida
          mkdir -p extracted salida
          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

      - name: Encontrar proyecto Android
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "El ZIP no contiene un proyecto Gradle Android"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar secretos de firma
        shell: bash
        run: |
          for V in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!V}" ]; then
              echo "Falta el GitHub Secret $V"
              exit 1
            fi
          done

      - name: Restaurar firma permanente
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"
          KEYSTORE="$RUNNER_TEMP/tesoreria-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "No se pudo reconstruir el keystore"
            exit 1
          fi
          echo "TESORERIA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Leer versión
        id: version
        shell: bash
        run: |
          GRADLE_FILE="${{ steps.project.outputs.dir }}/app/build.gradle.kts"
          VERSION_CODE=$(grep -m1 -E 'versionCode[[:space:]]*=' "$GRADLE_FILE" | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -m1 -E 'versionName[[:space:]]*=' "$GRADLE_FILE" | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "No se pudo leer versionCode/versionName"
            exit 1
          fi
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=tesoreria-v${VERSION_NAME}-vc${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK release firmado
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleRelease --no-daemon --stacktrace
          else
            gradle clean assembleRelease --no-daemon --stacktrace
          fi

      - name: Recoger APK release
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No se encontró el APK release"
            exit 1
          fi
          cp "$APK" salida/tesoreria.apk
          sha256sum salida/tesoreria.apk | tee salida/tesoreria.apk.sha256

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesoreria-v${{ steps.version.outputs.name }}
          path: |
            salida/tesoreria.apk
            salida/tesoreria.apk.sha256
          if-no-files-found: error

      - name: Publicar actualización para la app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="Tesorería ${{ steps.version.outputs.name }}"
          cat > /tmp/release-notes.txt <<NOTES
          Actualización de Tesorería ${{ steps.version.outputs.name }}.

          versionCode: ${{ steps.version.outputs.code }}
          Compilada automáticamente por GitHub Actions con la firma permanente de Tesorería.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" salida/tesoreria.apk salida/tesoreria.apk.sha256 --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.txt --latest
          else
            gh release create "$TAG" salida/tesoreria.apk salida/tesoreria.apk.sha256 \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.txt \
              --latest
          fi
